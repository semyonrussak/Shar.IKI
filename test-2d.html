<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shar.IKI 2D – Тестовый стенд</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }

        button {
            margin: 5px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        #app-2d {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn-equi">Equirectangular</button>
        <button id="btn-merc">Web Mercator</button>
        <button id="btn-geopolar">Geomagnetic Polar</button>
    </div>
    <div id="app-2d"></div>
    <script type="module" src="/src/2d/main.ts"></script>
</body>
</html>
